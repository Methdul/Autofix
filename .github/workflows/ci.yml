name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Server Dependencies
        run: |
          cd server
          npm install

      - name: Run Server Build
        run: |
          cd server
          npm run build

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Run Client Build
        run: |
          cd client
          npm run build
